    <script type="module">
      function showCallout() {
        document.getElementById("callout").classList.remove("squashed");
        document.getElementById("callout").classList.remove("inactive");
      }

      const viewer = document.querySelector("vntana-viewer");

      document.getElementById("side-view").addEventListener("click", () => {
        // Update Callout
        showCallout();
        document.getElementById("callout-header").innerText = "OceanDream 5000";
        document.getElementById("callout-text").innerText = "Step aboard the OceanDream 5000, where the horizon is your only limit. Immerse yourself in a world of opulence, relaxation, and adventure. Crafted with precision and designed with sophistication, our yacht boasts timeless beauty, from its sleek lines to its luxurious interiors.";
        
        // Position One
        viewer.setCameraRotation("0.26179938779914935rad -1.5707963267948966rad 0rad");
        viewer.setCameraDistance("2.743782226240391r");
        viewer.setCameraTarget("0r 0r 0r")
      });

      document.getElementById("back-deck").addEventListener("click", () => {
        // Update Callout
        showCallout();
        document.getElementById("callout-header").innerText = "Deck";
        document.getElementById("callout-text").innerText = "The deck of the OceanDream 5000 boasts an abundance of comfortable lounges and sunbeds strategically placed for the ultimate relaxation experience. Whether you're soaking up the sun, sipping cocktails, or stargazing under the night sky, our lounges are designed with your comfort in mind.";

        // Position Two
        viewer.setCameraRotation("-0.37610209735644085rad -2.712091563132102rad 0rad");
        viewer.setCameraDistance("0.8092878883914102r");
        viewer.setCameraTarget("0.09354871669701487r -0.7367940167180103r -0.23263606352595337r");
      });

      document.getElementById("master-bedroom").addEventListener("click", () => {
        // Update Callout
        showCallout();
        document.getElementById("callout-header").innerText = "Master Bedroom";
        document.getElementById("callout-text").innerText = "Your sanctuary on the sea, the master bedroom is a haven of tranquility. With its generous space, plush king-sized bed, and floor-to-ceiling windows, you'll wake up to awe-inspiring sunrises and fall asleep under a blanket of stars. Enjoy direct access to your private deck, where the gentle lull of the waves is your soundtrack to relaxation.";

        // Position Three
        viewer.setCameraRotation("-0.12267336252991456rad -0.017318592357171786rad 0rad");
        viewer.setCameraDistance("0.8334179213034469r");
        viewer.setCameraTarget("0.0025875480377875668r -0.6596361825247716r -0.09862561815113621r");
      });

      document.getElementById("dining").addEventListener("click", () => {
        // Update Callout
        showCallout();
        document.getElementById("callout-header").innerText = "Dining Room";
        document.getElementById("callout-text").innerText = "Indulge your senses in the elegant dining room, where every meal becomes a culinary masterpiece. Whether you're enjoying a romantic dinner for two or hosting a gathering of friends, the dining room is a setting where gastronomic delight meets stunning ocean views.";

        // Position Four
        viewer.setCameraRotation("-0.1746291396014097rad 0.8035826853724671rad 0rad");
        viewer.setCameraDistance("0.08616313376529962r");
        viewer.setCameraTarget("0.02677836222436635r -0.6050167637261612r -0.12031416782960103r");
      });

      document.getElementById("deck").addEventListener("click", () => {
        // Update Callout
        showCallout();
        document.getElementById("callout-header").innerText = "Upper Deck";
        document.getElementById("callout-text").innerText = "The expansive deck is your private oasis at sea, offering endless possibilities for enjoyment. Bask in the warm sun on comfortable loungers, sip cocktails at the outdoor bar, or dine al fresco with the soothing sea breeze as your companion. As the sun sets, gather with loved ones to watch the horizon burst into a canvas of colors, creating memories that will last a lifetime.";

        // Position Five
        viewer.setCameraRotation("-0.20464803302050405rad -0.5611223923721563rad 0rad");
        viewer.setCameraDistance("0.24628401459487378r");
        viewer.setCameraTarget("-0.03289411251504316r -0.4981756192337639r -0.07489830010718312r");
      });

      document.getElementById("fullscreen-button").addEventListener("click", () => {
        const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement;

        if (isFullscreen) {
          document.exitFullscreen() ||
          document.webkitExitFullscreen() ||
          document.mozCancelFullScreen();
        } else {
          const element = document.querySelector("body");
          element.requestFullscreen() ||
          element.webkitRequestFullscreen() ||
          element.mozRequestFullscreen();
        }
        
        document.getElementById("fullscreen-button").classList.toggle("fullscreen");
      });
    </script>
